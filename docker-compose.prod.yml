# rev3-admin prod override
#
# 用法(配合 base):
#   prod baseline(需先 seed cert 進 rev3-admin_front_nginx_certs volume):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#   prod + acme skeleton:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --wait
#
# 特性:
#   - front-nginx:0.0.0.0:80+443(prod 對外);80→443 強制 redirect(prod.conf)
#   - base-web:multi-stage nginx build(Dockerfile.base-web.txt);internal only
#   - rust-api:runtime target built image :latest;internal only
#   - postgres/redis:127.0.0.1 loopback 直連 debug port(prod 環境按需關閉)
#   - acme:profile=prod,idle skeleton,待設 DNS provider creds 後啟用 --issue

services:
  front-nginx:
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/_locations.inc:/etc/nginx/conf.d/_locations.inc:ro
      - ./deploy/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - front_nginx_certs:/etc/nginx/certs:ro
    restart: unless-stopped

  base-web:
    build:
      context: ./base-web
      dockerfile: ../deploy/Dockerfile.base-web.txt
      args:
        VITE_SERVICE_BASE_URL: /api
    image: rev3-admin-base-web:latest
    restart: unless-stopped

  rust-api:
    image: rev3-admin-rust-api:latest
    restart: unless-stopped
    volumes:
      # 013：信任拓樸 config（operator 依實際拓樸編輯；含 CF 段時零 CF code、純 trusted CIDR 配置）
      - ./deploy/trust-model.toml:/etc/rev3/trust-model.toml:ro
    environment:
      # 013：信任拓樸 config 檔（兩層解析 + CF overlay 的 trusted 來源）。缺檔 fallback 下方 flat env。
      TRUST_MODEL_FILE: "/etc/rev3/trust-model.toml"
      # 007/013 fallback：prod 經 front-nginx reverse-proxy → 必信任 nginx/docker 內網段才能自 XFF 解析真實
      #   client IP（fail-safe 預設空＝退化成採 nginx peer IP）。優先用 TRUST_MODEL_FILE、本項為缺檔 fallback。
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      # xdb region 檔（runtime WORKDIR=/app；由 Dockerfile runtime 段 COPY xdb/resources → /app/resources）。
      XDB_FILEPATH: "resources/ip2region.xdb"

  migrate:
    # ★ prod migrate:runtime image,command [migration, up] 經 entrypoint.rust-api.sh dispatcher
    #   的 case "migration" 分支派發 → exec /usr/local/bin/migration up。與 dev 不同:dev override
    #   entrypoint(cargo-watch image),prod 不 override entrypoint(runtime dispatcher 即設計派發點)。
    #   DATABASE_URL 由 base migrate 的 APP_DATABASE_URL_FILE + database_url secret 繼承,不重宣告。
    build:
      target: runtime
    image: rev3-admin-rust-api:latest
    command: ["migration", "up"]
    # migration 走 dispatcher migration 分支、不開 31081 port → 繼承 runtime image 的
    # HEALTHCHECK(curl :31081/health)永遠 fail（one-shot service、>35s migration＋未來 --wait 假陰性伏筆）→ 停用。
    healthcheck:
      disable: true

  postgres:
    ports:
      - "127.0.0.1:35432:5432"
    restart: unless-stopped

  redis-stack:
    ports:
      - "127.0.0.1:36379:6379"
    restart: unless-stopped

  acme:
    volumes:
      - front_nginx_certs:/acme.sh
    restart: unless-stopped

  # ═══ 018-observability obs internal-only override（prod）═══
  #   ★ internal-only：obs service 不映任何 host port（dev override 才映 33000/33100/33090/39091）→
  #     prod 觀測端點僅內網 rev3_net 可達、不對外（spec FR-003、Out-of-Scope「prod internal-only 落實」）。
  #   ★ config bind-mount 須與 dev 對齊（base 層不放 bind-mount、dev/prod override 各自提供；同 trust-model.toml 模式）
  #     ——否則 prod loki 退預設 config（非 72h retention）、alloy 無 KEEP relabel、grafana 無 datasource/dashboard
  #     provisioning、prometheus 無 4-job scrape（U1 spec-review LOW 接住）。皆 profiles:[obs]/[metrics] opt-in。
  loki:
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
    restart: unless-stopped

  alloy:
    volumes:
      - ./deploy/alloy-config.alloy:/etc/alloy/config.alloy:ro
    restart: unless-stopped

  grafana:
    volumes:
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  prometheus:
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  postgres_exporter:
    restart: unless-stopped

  redis_exporter:
    restart: unless-stopped

  pushgateway:
    restart: unless-stopped
