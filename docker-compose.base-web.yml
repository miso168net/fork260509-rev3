# ⚠️ DEPRECATED — 本 standalone compose 非主流入口(001-infra-deploy master compose 已落地)
# 主流用法:docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
# 保留作 single-service debug 後備、未來不一定同步(research R8 定位)
#
# base-web 容器化 (Vue 3 starter,worktree + submodule)
#
# 用法:
#   dev 模式(熱重載,http://127.0.0.1:31079):
#     docker compose -f docker-compose.base-web.yml --profile dev up
#   prod 模式(build + nginx serve,http://127.0.0.1:31079):
#     docker compose -f docker-compose.base-web.yml --profile prod up --build
#   停止 + 移除容器:
#     docker compose -f docker-compose.base-web.yml --profile dev down
#     docker compose -f docker-compose.base-web.yml --profile prod down
#   清掉 named volume(強制下次重 pnpm install):
#     docker volume rm rev3-admin_base_web_node_modules rev3-admin_base_web_pnpm_store
#
# 設計:
#   - profile 用法永遠顯式 -f + --profile dev|prod (不用 docker-compose.override.yml auto-load)
#   - 完全不需 host 裝 node/pnpm
#   - dev mode 用 named volume mask /app/node_modules,避免 WSL2 bind mount 拖慢 IO
#   - prod mode multi-stage build,Dockerfile 在 deploy/Dockerfile.base-web.txt
#   - prod 預設 VITE_SERVICE_BASE_URL 指官方 mock(無需 rust-api、可單獨渲染);要連 local
#     rust-api 自行覆寫 VITE_SERVICE_BASE_URL(經 front-nginx 走 /api、或直連 rust-api port)
#     ——master prod 走 `/api`(front-nginx 反代、internal-only)、本 standalone 走 mock,刻意有別
#
# ⚠️ 並行撞點警示（與 rust-api standalone 對稱）：本檔 project name 同為 `rev3-admin`、
#    且共用 base_web_node_modules / base_web_pnpm_store 卷——**勿與 master stack（docker-compose.yml）
#    同時起**,否則同 project/卷互相干擾（容器/卷衝突）。base-web 已以 standalone 定義納入 master
#    dev.yml（R8），日常用 master;本 standalone 僅 base-web 單獨 debug 時用、用前先 down master。

name: rev3-admin

services:
  base-web-dev:
    profiles: ["dev"]
    image: node:26-alpine
    container_name: rev3-admin-base-web-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
      - BROWSER=none
      - npm_config_store_dir=/pnpm-store
      - CI=true
    volumes:
      - ./base-web:/app
      - base_web_node_modules:/app/node_modules
      - base_web_pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:31079:31079"
    command:
      - sh
      - -c
      - "npm install -g pnpm@10 && pnpm install && pnpm dev --host 0.0.0.0 --port 31079"
    init: true
    tty: true
    stdin_open: true

  base-web-prod:
    profiles: ["prod"]
    build:
      context: ./base-web
      dockerfile: ../deploy/Dockerfile.base-web.txt
      args:
        VITE_SERVICE_BASE_URL: "${VITE_SERVICE_BASE_URL:-https://mock.apifox.cn/m1/3109515-0-default}"
    image: rev3-admin-base-web:latest
    container_name: rev3-admin-base-web
    ports:
      - "127.0.0.1:31079:31079"
    restart: unless-stopped

volumes:
  base_web_node_modules:
  base_web_pnpm_store:
