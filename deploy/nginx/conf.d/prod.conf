server {
    listen 80;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # 安全 header（§3.A prod 硬化；always＝錯誤回應也帶；HSTS 僅 HTTPS 有意義；_locations.inc 無 add_header、server 層可繼承）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # M-8（correctness/security review、§3.J）：補 Referrer-Policy + Permissions-Policy + 結構性 CSP。
    # ★ CSP 僅放【不限資源載入】的指令（frame-ancestors/base-uri/object-src）＝clickjacking 縱深 + base-tag
    #   注入 + plugin 阻擋，【不破 SPA】；完整資源 CSP（script/style/connect-src）會破 vite/naive-ui SPA、
    #   需 prod-mode CDP 逐源驗證後再緊，登 CHECKLIST §3.J follow-up。
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    include /etc/nginx/conf.d/_locations.inc;
}
