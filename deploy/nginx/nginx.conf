events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;

    gzip on;
    gzip_types text/plain text/css application/json text/xml application/xml text/javascript;
    gzip_min_length 1024;

    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"service":"front-nginx",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # ════════════════════════════════════════════════════════════════════════
    # 013 FR-010 · Cloudflare 權威驗證閘（geo + map、http context）
    #
    # 鐵律：rust-api 絕不自己用 XFF 判「是否經過 CF」（XFF 可注入）。判斷權在看得到
    # 真實 TCP peer（$remote_addr、偽造不了）的 nginx。命中「CF 官方邊緣段 ∪ cloudflared
    # 本機 ingress」才把 X-CF-Verified 蓋成 1；rust 盲信此旗標（防偽造責任在本層）。
    #
    # ★ 用 geo 不用 map：map 不支援原生 CIDR 比對、CF 邊緣段是 CIDR（geo 是 http-context、內建）。
    # ★ CF 官方段由 operator 自更新（來源 https://www.cloudflare.com/ips/、v4+v6 全列）。
    # ★ 刻意「不」含一般 docker bridge gateway（172.16/12）→ 讓 dev host 直連流量的
    #   $remote_addr（gateway）非 verified、可端到端測偽造 negative（FR-010 / SC-002）。
    #   cloudflared-in-docker 部署：operator 另把其 ingress 容器 IP/段加進下方 geo 命中集。
    geo $remote_addr $x_cf_verified {
        default              0;
        # ── CF 官方邊緣段 v4（cloudflare.com/ips-v4）──
        173.245.48.0/20      1;
        103.21.244.0/22      1;
        103.22.200.0/22      1;
        103.31.4.0/22        1;
        141.101.64.0/18      1;
        108.162.192.0/18     1;
        190.93.240.0/20      1;
        188.114.96.0/20      1;
        197.234.240.0/22     1;
        198.41.128.0/17      1;
        162.158.0.0/15       1;
        104.16.0.0/13        1;
        104.24.0.0/14        1;
        172.64.0.0/13        1;
        131.0.72.0/22        1;
        # ── CF 官方邊緣段 v6（cloudflare.com/ips-v6）──
        2400:cb00::/32       1;
        2606:4700::/32       1;
        2803:f800::/32       1;
        2405:b500::/32       1;
        2405:8100::/32       1;
        2a06:98c0::/29       1;
        2c0f:f248::/32       1;
        # ── cloudflared 本機 ingress（Tunnel 模式 origin 無對外開埠、loopback 連入）──
        127.0.0.1/32         1;
        ::1/128              1;
    }
    # 非 CF 源就把客戶端自帶的 CF-Connecting-IP strip 成空（只有 verified=1 才放行）。
    map $x_cf_verified $cf_cip_safe {
        1        $http_cf_connecting_ip;
        default  "";
    }

    include /etc/nginx/conf.d/*.conf;
}
