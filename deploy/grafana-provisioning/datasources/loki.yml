# 018-observability U1 obs-min：grafana loki datasource provisioning（冪等、FR-019）。
# research R7 hindsight：① deleteDatasources guard（免重建時 uid 衝突 crash-loop）；
#   ② 顯式 uid: loki（dashboard panel datasource ref 依賴穩定 uid、漂移即 panel 斷）。
apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
