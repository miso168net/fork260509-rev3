# 018-observability U2 obs-full：grafana-managed unified alerting 規則 provisioning（rules-only D3）。
# ★ 3 baseline rule（FR-015）；★ 不 provision contact point/notification policy（送信延後、FR-017/Out-of-Scope）。
# noDataState=Alerting 僅用於 down 類 rule（採集端/服務 down＝無 up 資料 視為告警）；★ 高-5xx rule 改 noDataState=OK
#   （無 5xx 資料＝健康、非告警；否則 idle/零 5xx 時 ratio query 回空向量、被 noData=Alerting 誤升 Firing＝false positive）。
# execErrState=Alerting（rule 評估錯誤值得標示）；datasourceUid: prometheus（對齊 datasources/prometheus.yml uid）。
# 每 rule 結構：data[] 含 prometheus query（refId A、relativeTimeRange）＋ __expr__ threshold（refId C、condition）。
# job 名（rust-api/postgres/redis）對齊 prometheus.yml job_name；up selector 不可漂。
apiVersion: 1

groups:
  - orgId: 1
    name: obs-full-baseline
    folder: obs-full
    interval: 1m
    rules:
      # ① 核心服務 down：up{job="rust-api"} < 1，for 2m，critical。
      - uid: obsfull-rustapi-down
        title: obsfull-rustapi-down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: rust-api 後端服務 down（up{job=rust-api} < 1）
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="rust-api"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query

      # ② 依賴採集端 down：up{job=~"postgres|redis"} < 1，for 2m，critical。
      - uid: obsfull-infra-exporter-down
        title: obsfull-infra-exporter-down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: 依賴採集端 down（up{job=~postgres|redis} < 1）
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job=~"postgres|redis"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query

      # ③ 高 5xx 率：sum(rate(5xx)) / clamp_min(sum(rate(all)),1) > 0.05，for 5m，warning。
      - uid: obsfull-rustapi-high-5xx
        title: obsfull-rustapi-high-5xx
        condition: C
        for: 5m
        # ★ 無 5xx 資料＝健康（不同於 down rule 的「無 up 資料＝target 沒了」）→ noDataState: OK，
        #   否則 idle/零 5xx 時 ratio 回空向量、被 noData=Alerting 誤升 Firing（false positive）。
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: rust-api 伺服器錯誤率過高（5xx > 5%）
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: (sum(rate(axum_http_requests_total{status=~"5.."}[5m])) or vector(0)) / clamp_min(sum(rate(axum_http_requests_total[5m])) or vector(0), 1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query
