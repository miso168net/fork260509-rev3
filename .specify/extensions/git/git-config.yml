# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: true
  before_clarify:
    enabled: true
    message: "chore(speckit): clarify 前置自動收殘"
  before_plan:
    enabled: true
    message: "chore(speckit): plan 前置自動收殘"
  before_tasks:
    enabled: true
    message: "chore(speckit): tasks 前置自動收殘"
  before_implement:
    enabled: true
    message: "chore(speckit): implement 前置自動收殘"
  before_checklist:
    enabled: true
    message: "chore(speckit): checklist 前置自動收殘"
  before_analyze:
    enabled: true
    message: "chore(speckit): analyze 前置自動收殘"
  before_taskstoissues:
    enabled: true
    message: "chore(speckit): issue-sync 前置自動收殘"
  after_constitution:
    enabled: true
    message: "docs(speckit): constitution 產出自動 commit"
  after_specify:
    enabled: true
    message: "docs(speckit): specify 產出自動 commit（spec＋checklist）"
  after_clarify:
    enabled: true
    message: "docs(speckit): clarify 產出自動 commit"
  after_plan:
    enabled: true
    message: "docs(speckit): plan 產出自動 commit（plan＋research＋contracts）"
  after_tasks:
    enabled: true
    message: "docs(speckit): tasks 產出自動 commit"
  after_implement:
    enabled: true
    message: "chore(speckit): implement 產出自動 commit"
  after_checklist:
    enabled: true
    message: "docs(speckit): checklist 產出自動 commit"
  after_analyze:
    enabled: true
    message: "docs(speckit): analyze 產出自動 commit"
  after_taskstoissues:
    enabled: true
    message: "chore(speckit): issue-sync 產出自動 commit"
