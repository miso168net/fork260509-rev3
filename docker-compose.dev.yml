# rev3-admin dev override
#
# 用法(配合 base):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# 特性:
#   - 全部 host port 綁 127.0.0.1 loopback(開發機隔離)
#   - front-nginx:HTTP :31080 + HTTPS :31443(dev-certs bind mount + dev.conf)
#   - base-web:node:26-alpine hot-reload vite dev --host 0.0.0.0 --port 31079
#     (定義採 docker-compose.base-web.yml standalone 已驗形,R8 凍結)
#   - rust-api:cargo-watch dev target(bind mount source + named volume mask cargo/target)
#   - postgres/redis:直連 debug port

services:
  front-nginx:
    ports:
      - "127.0.0.1:31080:31080"
      - "127.0.0.1:31443:31443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/_locations.inc:/etc/nginx/conf.d/_locations.inc:ro
      - ./deploy/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/dev-certs:/etc/nginx/certs:ro
    healthcheck:
      # 127.0.0.1 而非 localhost:alpine localhost 先解 ::1(IPv6),nginx listen 31080 只綁 IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:31080/health | grep -q ok"]

  base-web:
    image: node:26-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      - BROWSER=none
      - npm_config_store_dir=/pnpm-store
      - CI=true
    volumes:
      - ./base-web:/app
      - base_web_node_modules:/app/node_modules
      - base_web_pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:31079:31079"
    command:
      - sh
      - -c
      - "npm install -g pnpm@10 && pnpm install && pnpm dev --host 0.0.0.0 --port 31079"
    healthcheck:
      # 127.0.0.1 而非 localhost:vite --host 0.0.0.0 只綁 IPv4,alpine localhost 先解 ::1 → 連不上
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:31079/ | grep -qi '<!doctype\\|<html'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    tty: true
    stdin_open: true

  rust-api:
    build:
      target: dev
    image: rev3-admin-rust-api:dev
    volumes:
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo
      - rust_api_target:/app/target
      # 013：信任拓樸 config（boot-only 載入；缺檔 fallback flat TRUSTED_PROXY_CIDRS）
      - ./deploy/trust-model.toml:/etc/rev3/trust-model.toml:ro
    ports:
      - "127.0.0.1:31081:31081"
    environment:
      APP_JWT_JWT_SECRET: "${APP_JWT_JWT_SECRET:-dev_jwt_secret_for_local_only_x32xxxxxx}"
      APP_JWT_REFRESH_TOKEN_SECRET: "${APP_JWT_REFRESH_TOKEN_SECRET:-dev_refresh_secret_for_local_only_x32xx}"
      RUST_LOG: "info,tower_http=debug"
      # 013：信任拓樸 config 檔（兩層解析；含 docker bridge → 經 front-nginx 的 peer 視為 internal、
      #   由 XFF 解析真實 client）。缺檔時 fallback 下方 flat TRUSTED_PROXY_CIDRS。
      TRUST_MODEL_FILE: "/etc/rev3/trust-model.toml"
      # 007/013 fallback：TRUST_MODEL_FILE 缺檔時的扁平 trusted 集（空＝all-direct fail-safe）。
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      # xdb region 檔（dev WORKDIR=/app、bind-mount、檔在 /app/xdb/resources/ip2region.xdb）。
      XDB_FILEPATH: "xdb/resources/ip2region.xdb"
    healthcheck:
      # dev image 無 curl/wget,用 bash /dev/tcp TCP probe(T008 review 警示 carry)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/31081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    init: true

  # ═══ 014 U7：多副本驗證用第二 rust-api 實例（profiles:[multi]、dev 預設 up 不啟）═══
  # 用法:docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile multi up -d rust-api-2 --wait
  #
  # 目的(C-V-6 C1 拍板 B-驗證):證明跨副本共享狀態收斂 ——
  #   ① settings:invalidate watcher 跨實例收斂(single_session_default)
  #   ② shared session pointer(DB)跨副本一致踢(7777)
  #   ③ Redis denylist 跨副本一致(8888)
  #   ④ CLIENT KILL TYPE pubsub 後 watcher 重訂閱韌性(非永久脫鉤)
  #
  # 設計抉擇:
  #   - entrypoint override = cargo run --bin server(非 cargo-watch):避免兩 cargo-watch 互相
  #     rebuild-loop;靜態驗收期無 code change,跑既編好 binary 即可(範式同 migrate service)。
  #   - target volume = 獨立 rust_api2_target(非共用 rust_api_target):rust-api 是 cargo-watch、
  #     重編時持 build lock;共用 target 會與本實例 cargo run 的 target 互擾。獨立卷=乾淨隔離
  #     (代價:首啟冷編 ~240s;profiles 為 opt-in 驗收用,可接受)。cargo registry/git cache
  #     (rust_api_cargo_cache)read-mostly、可安全共用(實例1已 populate,實例2不重抓 crate)。
  #   - jwt/refresh secret 走 _FILE(同 rust-api,共用同一 secret 檔)→ token 跨實例可驗;
  #     ★ 注意:dev rust-api 雖另設 inline APP_JWT_JWT_SECRET,但 config.rs load_secret_file_first
  #     是「_FILE 優先」、inline 被 shadow,故實例1實際也用 secret 檔值 → 兩實例同密鑰。
  rust-api-2:
    profiles: [multi]
    image: rev3-admin-rust-api:dev
    entrypoint: ["cargo", "run", "--bin", "server"]
    volumes:
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo
      - rust_api2_target:/app/target
      - ./deploy/trust-model.toml:/etc/rev3/trust-model.toml:ro
    ports:
      - "127.0.0.1:31082:31081"
    environment:
      APP_JWT_JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_JWT_REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      APP_DATABASE_URL_FILE: /run/secrets/database_url
      APP_REDIS_URL_FILE: /run/secrets/redis_url
      RUST_LOG: "info,tower_http=debug"
      TRUST_MODEL_FILE: "/etc/rev3/trust-model.toml"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      XDB_FILEPATH: "xdb/resources/ip2region.xdb"
    secrets:
      - jwt_secret
      - refresh_token_secret
      - database_url
      - redis_url
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/31081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 240s
    init: true
    networks:
      - rev3_net

  migrate:
    # ★ entrypoint 必須 override:dev image ENTRYPOINT 是 cargo-watch(跑 server),
    #   只設 command 會被 cargo-watch 當 watch 參數;此處整段換成 cargo run --bin migration up
    #   (R6 凍結:compose-level entrypoint override 不改 Dockerfile ENTRYPOINT)
    #   DATABASE_URL 由 base migrate 的 APP_DATABASE_URL_FILE + database_url secret 繼承
    build:
      target: dev
    image: rev3-admin-rust-api:dev
    volumes:
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo
      - rust_api_target:/app/target
    entrypoint: ["cargo", "run", "--bin", "migration"]
    command: ["up"]

  postgres:
    ports:
      - "127.0.0.1:35432:5432"

  redis-stack:
    ports:
      - "127.0.0.1:36379:6379"

  # ═══ 018-observability U1 obs-min dev override（host port 綁 127.0.0.1 loopback + config bind-mount）═══
  #   networks 繼承 base（不重列）；profiles:[obs] 由 base 定義、override 不重設。
  loki:
    ports:
      - "127.0.0.1:33100:3100"
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro

  alloy:
    volumes:
      - ./deploy/alloy-config.alloy:/etc/alloy/config.alloy:ro

  grafana:
    ports:
      - "127.0.0.1:33000:3000"
    volumes:
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro

  # ═══ 018-observability U2 obs-full metrics dev override（host port 綁 127.0.0.1 + config bind-mount）═══
  #   networks 繼承 base（不重列）；profiles:[metrics] 由 base 定義、override 不重設。
  prometheus:
    ports:
      - "127.0.0.1:33090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  pushgateway:
    ports:
      - "127.0.0.1:39091:9091"

# 014 U7：rust-api-2 專用 target 卷(獨立隔離,避免與 rust-api cargo-watch 互擾)。
# 無顯式 name:,繼承 master project name → 實際卷名 rev3-admin_rust_api2_target(§8.2.2 命名規則)。
volumes:
  rust_api2_target:
