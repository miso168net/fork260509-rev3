# rev3-admin dev override
#
# 用法(配合 base):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# 特性:
#   - 全部 host port 綁 127.0.0.1 loopback(開發機隔離)
#   - front-nginx:HTTP :31080 + HTTPS :31443(dev-certs bind mount + dev.conf)
#   - base-web:node:26-alpine hot-reload vite dev --host 0.0.0.0 --port 31079
#     (定義採 docker-compose.base-web.yml standalone 已驗形,R8 凍結)
#   - rust-api:cargo-watch dev target(bind mount source + named volume mask cargo/target)
#   - postgres/redis:直連 debug port

services:
  front-nginx:
    ports:
      - "127.0.0.1:31080:31080"
      - "127.0.0.1:31443:31443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/_locations.inc:/etc/nginx/conf.d/_locations.inc:ro
      - ./deploy/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/dev-certs:/etc/nginx/certs:ro
    healthcheck:
      # 127.0.0.1 而非 localhost:alpine localhost 先解 ::1(IPv6),nginx listen 31080 只綁 IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:31080/health | grep -q ok"]

  base-web:
    image: node:26-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      - BROWSER=none
      - npm_config_store_dir=/pnpm-store
      - CI=true
    volumes:
      - ./base-web:/app
      - base_web_node_modules:/app/node_modules
      - base_web_pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:31079:31079"
    command:
      - sh
      - -c
      - "npm install -g pnpm@10 && pnpm install && pnpm dev --host 0.0.0.0 --port 31079"
    healthcheck:
      # 127.0.0.1 而非 localhost:vite --host 0.0.0.0 只綁 IPv4,alpine localhost 先解 ::1 → 連不上
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:31079/ | grep -qi '<!doctype\\|<html'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    tty: true
    stdin_open: true

  rust-api:
    build:
      target: dev
    image: rev3-admin-rust-api:dev
    volumes:
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo
      - rust_api_target:/app/target
      # 013：信任拓樸 config（boot-only 載入；缺檔 fallback flat TRUSTED_PROXY_CIDRS）
      - ./deploy/trust-model.toml:/etc/rev3/trust-model.toml:ro
    ports:
      - "127.0.0.1:31081:31081"
    environment:
      APP_JWT_JWT_SECRET: "${APP_JWT_JWT_SECRET:-dev_jwt_secret_for_local_only_x32xxxxxx}"
      APP_JWT_REFRESH_TOKEN_SECRET: "${APP_JWT_REFRESH_TOKEN_SECRET:-dev_refresh_secret_for_local_only_x32xx}"
      RUST_LOG: "info,tower_http=debug"
      # 013：信任拓樸 config 檔（兩層解析；含 docker bridge → 經 front-nginx 的 peer 視為 internal、
      #   由 XFF 解析真實 client）。缺檔時 fallback 下方 flat TRUSTED_PROXY_CIDRS。
      TRUST_MODEL_FILE: "/etc/rev3/trust-model.toml"
      # 007/013 fallback：TRUST_MODEL_FILE 缺檔時的扁平 trusted 集（空＝all-direct fail-safe）。
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      # xdb region 檔（dev WORKDIR=/app、bind-mount、檔在 /app/xdb/resources/ip2region.xdb）。
      XDB_FILEPATH: "xdb/resources/ip2region.xdb"
    healthcheck:
      # dev image 無 curl/wget,用 bash /dev/tcp TCP probe(T008 review 警示 carry)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/31081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    init: true

  migrate:
    # ★ entrypoint 必須 override:dev image ENTRYPOINT 是 cargo-watch(跑 server),
    #   只設 command 會被 cargo-watch 當 watch 參數;此處整段換成 cargo run --bin migration up
    #   (R6 凍結:compose-level entrypoint override 不改 Dockerfile ENTRYPOINT)
    #   DATABASE_URL 由 base migrate 的 APP_DATABASE_URL_FILE + database_url secret 繼承
    build:
      target: dev
    image: rev3-admin-rust-api:dev
    volumes:
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo
      - rust_api_target:/app/target
    entrypoint: ["cargo", "run", "--bin", "migration"]
    command: ["up"]

  postgres:
    ports:
      - "127.0.0.1:35432:5432"

  redis-stack:
    ports:
      - "127.0.0.1:36379:6379"
