# rev3-admin master compose — base layer (5 service 共通定義 + migrate + acme/cleanup-job 殼)
#
# 用法:
#   dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#   prod + acme: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --wait
#
# 設計(R1/H1 規則 carry):
#   - base 層禁止放 host ports(ports: 為 list append → dev/prod 疊加衝突)
#   - base 層禁止放 dev/prod 專屬 volume/bind-mount
#   - base-web 不放 image/build/command(dev=node image 無 build;prod=nginx build;異質、無法靠 target 覆寫)
#   - rust-api 放 build(dev/prod 同 Dockerfile 不同 target,override 覆寫 build.target 即可)
#   - named volume 不設顯式 name:,靠 project name (rev3-admin) auto-prefix → 實際名 rev3-admin_<service>_<purpose>

name: rev3-admin

services:
  front-nginx:
    image: nginx:1.31.0-alpine
    depends_on:
      base-web:
        condition: service_healthy
      rust-api:
        condition: service_healthy
    healthcheck:
      # dev override 改 :31080(dev.conf 無 :80);prod 直接用(prod.conf 在 :80 先回 200 再 redirect)
      # 用 127.0.0.1 而非 localhost:alpine /etc/hosts 把 localhost 先解到 ::1(IPv6),
      # nginx listen 80 只綁 IPv4 → localhost 會 connection refused、healthcheck 永遠 fail
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rev3_net

  base-web:
    # ★ image/build/command 故意不放 base 層(H1:base-web 與 rust-api 的差異):
    #   dev override → node image(無 build);prod override → nginx multi-stage build
    #   異質不能靠 target 覆寫;若在 base 放 build,dev 疊加時 docker 會誤 build 並錯誤 tag
    depends_on: {}
    networks:
      - rev3_net

  rust-api:
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api.txt
      target: runtime
    image: rev3-admin-rust-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # jwt 兩支與 redis_url 本刀「接而不讀」(R11:compose 接線就位、消費=後續 Auth 刀)
      APP_JWT_JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_JWT_REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      APP_DATABASE_URL_FILE: /run/secrets/database_url
      APP_REDIS_URL_FILE: /run/secrets/redis_url
      RUST_LOG: "info"
    secrets:
      - jwt_secret
      - refresh_token_secret
      - database_url
      - redis_url
    networks:
      - rev3_net

  migrate:
    # ★ 一次性 migration service(001 FR-002/FR-008:server 不自動 migrate,schema 由此 gate 套)
    #   dev/prod override 各自提供 target: + command:;base 層只定義共通結構
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api.txt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    restart: "no"
    networks:
      - rev3_net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: soybean
      POSTGRES_DB: soybean_admin_rust
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soybean -d soybean_admin_rust"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rev3_net

  redis-stack:
    # 映像 pin 數字版(⚠️d 拍板:不用 latest;升版走顯式 bump commit)
    image: redis/redis-stack-server:7.4.0-v8
    command:
      - sh
      - -c
      # command 覆寫繞過映像官方 entrypoint(其本會帶 --dir ${REDIS_DATA_DIR:-/data}),
      # 裸跑預設 dir=/var/lib/redis-stack(暫存層)→ /data named volume 形同虛設,
      # 故必須顯式 --dir /data(T014 實機驗收發現:down→up 資料全失)
      - 'redis-stack-server --dir /data --requirepass "$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/redis_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rev3_net

  acme:
    profiles: [prod]
    build:
      context: deploy/
      dockerfile: Dockerfile.acme.txt
    # init: tini 接 PID 1——acme-entrypoint 的 exec tail -f /dev/null 當 PID 1 時
    # 不處理 SIGTERM,docker stop 會等滿 10s 才 SIGKILL;tini 轉發信號根治
    init: true
    volumes:
      - front_nginx_certs:/acme.sh
    networks:
      - rev3_net

  cleanup-job:
    # 014 U5 cleanup-job binary 上線(§3.A、pre-波4 2026-06-23):過期 sys_token 週期清理 sidecar。
    #   profiles:[prod] opt-in(一般 dev/prod up 不啟、與 acme 同 prod 軌);只刪 expires_at < now-60s 列
    #   (冪等、不碰 valid token);DB URL 走 APP_DATABASE_URL_FILE(同 server、cleanup-job 自讀檔);
    #   sleep-loop 週期(CLEANUP_INTERVAL_SECS 預設 86400=每日);binary 已在 prod image /usr/local/bin。
    profiles: [prod]
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api.txt
      target: runtime
    image: rev3-admin-rust-api:latest
    # sidecar 跑 cleanup loop 非 server → 停用 image 繼承的 /health healthcheck(否則永遠 unhealthy)
    healthcheck:
      disable: true
    entrypoint:
      - sh
      - -c
      # $$ → compose 不 interpolate、留給容器內 sh 讀 CLEANUP_INTERVAL_SECS;cleanup-job 跑完即退、
      # 由 while-loop 週期重跑(transient DB err 致 binary panic 不中斷 loop、sleep 後重試)
      - 'while true; do /usr/local/bin/cleanup-job --execute; sleep $${CLEANUP_INTERVAL_SECS:-86400}; done'
    environment:
      APP_DATABASE_URL_FILE: /run/secrets/database_url
      RUST_LOG: "info"
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rev3_net

  # ═══ 018-observability U1 obs-min（log 軌、profiles:[obs] opt-in、一般 up 不啟）═══
  # ★ 每個 obs service MUST networks:[rev3_net]（rev3 無 default network、漏接＝service DNS 靜默不通）。
  #   loki_data/grafana_data/alloy_data 卷與 grafana_admin_password secret 已於頂層宣告（勿重複）。
  loki:
    profiles: [obs]
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - loki_data:/loki
    networks:
      - rev3_net

  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.16.1
    # user:root 讀 docker.sock（docker-SD 採集所有容器 stdout log）。
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - rev3_net

  grafana:
    profiles: [obs, metrics]
    image: grafana/grafana:13.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "$$__file{/run/secrets/grafana_admin_password}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
        required: false
    networks:
      - rev3_net

  # ═══ 018-observability U2 obs-full（metrics 軌、profiles:[metrics] opt-in、一般 up 不啟）═══
  # ★ 每個 obs service MUST networks:[rev3_net]（漏接＝prometheus scrape 該 target 靜默 down、容器卻起得來）。
  #   prometheus_data 卷已於頂層宣告（勿重複）；exporter/pushgateway 無持久卷。
  prometheus:
    profiles: [metrics]
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus_data:/prometheus
    networks:
      - rev3_net

  postgres_exporter:
    profiles: [metrics]
    image: prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      # DB 名＝soybean_admin_rust（對齊 postgres POSTGRES_DB）；reuse postgres_password、零新依賴憑證（FR-021）。
      DATA_SOURCE_URI: postgres:5432/soybean_admin_rust?sslmode=disable
      DATA_SOURCE_USER: soybean
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - rev3_net

  redis_exporter:
    profiles: [metrics]
    # ★ -alpine 變體（bare=FROM scratch 無 sh、下方 sh-wrapper 會掛、research R7 hindsight）。
    image: oliver006/redis_exporter:v1.85.0-alpine
    # ★ REDIS_ADDR 指 redis 服務名＝redis-stack（非 redis）；sh-wrapper export 密碼（reuse redis_password、FR-021）。
    environment:
      REDIS_ADDR: redis://redis-stack:6379
    entrypoint:
      - sh
      - -c
      - 'export REDIS_PASSWORD="$(cat /run/secrets/redis_password)"; exec /redis_exporter'
    secrets:
      - redis_password
    networks:
      - rev3_net

  pushgateway:
    profiles: [metrics]
    # cleanup-job 推 short-lived job metrics；in-memory（restart 失憶、無持久卷）。
    image: prom/pushgateway:v1.11.3
    networks:
      - rev3_net

networks:
  rev3_net:

volumes:
  postgres_data:
  redis_stack_data:
  front_nginx_certs:
  base_web_node_modules:
  base_web_pnpm_store:
  rust_api_cargo_cache:
  rust_api_target:
  # 018-observability obs-min 卷(profiles:[obs] opt-in、一般 up 不建;正典命名 §8.2.2)
  loki_data:
  grafana_data:
  alloy_data:
  # 018-observability metrics 卷(profiles:[metrics] opt-in、一般 up 不建)
  prometheus_data:

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
  redis_password:
    file: ./deploy/secrets/redis_password.txt
  jwt_secret:
    file: ./deploy/secrets/jwt_secret.txt
  refresh_token_secret:
    file: ./deploy/secrets/refresh_token_secret.txt
  database_url:
    file: ./deploy/secrets/database_url.txt
  redis_url:
    file: ./deploy/secrets/redis_url.txt
  # 018-observability U1:grafana admin 密碼(GF_SECURITY_ADMIN_PASSWORD $__file{} provider 注入)
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password.txt
